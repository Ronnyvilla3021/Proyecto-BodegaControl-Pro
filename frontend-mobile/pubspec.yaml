name: bodega_control_pro
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.3
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  signature: ^5.5.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Configuración de íconos del APK
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21

# ✅ SOLO UN BLOQUE "flutter:" con todo junto
flutter:
  uses-material-design: true
  
  assets:
    - assets/icon/logo.png